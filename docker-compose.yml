version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/zen_db
      - SESSION_SECRET=local-dev-secret-change-in-prod
      - ADMIN_EMAIL=admin@zen.com
      - ADMIN_PASSWORD=admin123
      - APP_NAME=Zen E-Commerce
      - BASE_PATH=
    networks:
      - ecommerce

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - ecommerce

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zen_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecommerce

volumes:
  pgdata:

networks:
  ecommerce:
    driver: bridge