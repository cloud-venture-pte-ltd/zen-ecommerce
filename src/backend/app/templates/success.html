{% include 'partials/header.html' %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-success">
      <div class="card-body text-center">
        <h1 class="h2 text-success mb-3">Order Placed Successfully</h1>
        <p class="lead">Thank you for your purchase.</p>
        <div class="mt-4 text-start">
          <p><strong>Order ID:</strong> {{ order_id }}</p>
          <p><strong>Total Paid:</strong> ${{ '%.2f'|format(total) }}</p>
          <p><strong>Payment Provider:</strong> {{ payment_provider }}</p>
          <p><strong>Payment Reference:</strong> {{ payment_reference }}</p>
        </div>
        <a href="{{ path_with_base('/') }}" class="btn btn-primary mt-3">Back to Store</a>
      </div>
    </div>
  </div>
</div>
{% include 'partials/footer.html' %}
