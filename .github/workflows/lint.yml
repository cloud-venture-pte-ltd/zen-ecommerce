name: Linting

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python
        run: |
          pip install ruff
          ruff check src/backend/

      - name: Lint JavaScript
        run: |
          cd src/frontend
          npm install
          npx eslint@8 --ext .js,.jsx pages/