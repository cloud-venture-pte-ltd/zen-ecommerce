version: '3.8'

services:
  # Backend container (Build pair: Zaid/Lan Tao)
  backend:
    build: ./src/backend
    ports: ["8000:8000"]
    depends_on: ["db"]
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/zen_db

  # Frontend container (Build pair: Zaid/Lan Tao)
  frontend:
    build: ./src/frontend
    ports: ["3000:3000"]
    depends_on: ["backend"]

  # Database (Infrastructure)
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zen_db