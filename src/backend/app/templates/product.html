{% include 'partials/header.html' %}
{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}
<div class="row g-4">
  <div class="col-md-6">
    <img src="{{ product.image_url or 'https://via.placeholder.com/800x600?text=No+Image' }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
  </div>
  <div class="col-md-6">
    <h1 class="h2">{{ product.name }}</h1>
    <p class="text-muted">Category: {{ product.category }}</p>
    <p>{{ product.description }}</p>
    <p class="price h4">${{ '%.2f'|format(product.price) }}</p>
    <p class="text-muted">Stock available: {{ product.stock }}</p>
    <form method="POST" action="{{ path_with_base('/cart/add/' ~ product.id) }}" class="row g-3">
      <div class="col-auto">
        <input type="number" name="quantity" min="1" value="1" class="form-control" required>
      </div>
      <div class="col-auto">
        <button class="btn btn-success" type="submit">Add to cart</button>
      </div>
    </form>
    <a href="{{ path_with_base('/') }}" class="btn btn-link mt-3 ps-0">← Back to store</a>
  </div>
</div>
{% include 'partials/footer.html' %}
