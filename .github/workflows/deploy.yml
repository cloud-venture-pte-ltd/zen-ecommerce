name: Deploy

on:
  push:
    branches:
      - dev
      - main

env:
  ACR_LOGIN_SERVER: zenecr2026.azurecr.io
  ACR_NAME: zenecr2026
  RESOURCE_GROUP_DEV: zen-rg-dev
  RESOURCE_GROUP_PROD: zen-rg-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Set environment name
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=${{ env.RESOURCE_GROUP_PROD }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=${{ env.RESOURCE_GROUP_DEV }}" >> $GITHUB_ENV
          fi

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }} ./src/backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        run: |
          docker build \
            --no-cache \
            --build-arg BACKEND_URL=https://zen-backend-${{ env.ENVIRONMENT }}.orangefield-15619624.southeastasia.azurecontainerapps.io \
            -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} \
            ./src/frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name zen-backend-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend to Container Apps
        run: |
          az containerapp update \
            --name zen-frontend-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} \
            --set-env-vars \
            "BACKEND_URL=https://zen-backend-${{ env.ENVIRONMENT }}.orangefield-15619624.southeastasia.azurecontainerapps.io"

      - name: Verify backend health
        run: |
          sleep 30
          az containerapp show \
            --name zen-backend-${{ env.ENVIRONMENT }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.runningStatus"

  notify-failure:
    needs: build-and-deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: echo "Pipeline failed on ${{ github.ref }} — check Actions tab"